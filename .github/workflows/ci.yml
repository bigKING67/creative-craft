name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-gates:
    name: Full gates / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check skills/creative-craft/scripts scripts tests
      - run: python scripts/validate_schemas.py
      - run: python scripts/validate.py
      - run: python scripts/host_smoke.py
      - run: python -m compileall -q skills scripts tests

  platform-smoke:
    name: Platform smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: runner.os == 'macOS'
        with:
          node-version: "24"
      - run: python scripts/validate.py
      - run: python scripts/host_smoke.py
      - name: Pi local package discovery
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/pi-home
        run: |
          mkdir -p "$HOME"
          npx --yes @earendil-works/pi-coding-agent@0.80.6 install . --no-approve
          npx --yes @earendil-works/pi-coding-agent@0.80.6 list

  package-boundary:
    name: GitHub package boundary / Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: python3 scripts/check_package.py
      - name: Exact package runtime smoke
        shell: bash
        run: |
          package_dir="${RUNNER_TEMP}/creative-craft-package"
          mkdir -p "$package_dir"
          package_name="$(npm pack --silent --pack-destination "$package_dir")"
          python3 scripts/package_smoke.py \
            --package "$package_dir/$package_name" \
            --json

  secrets-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
